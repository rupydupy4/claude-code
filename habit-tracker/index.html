<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="description" content="A simple habit tracker that works offline.">
  <title>Habit Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Habits</h1>
      <p id="today-label" class="muted"></p>
    </div>
    <button id="add-btn" class="add-btn" type="button" aria-label="Add a habit">+</button>
  </header>

  <main>
    <div id="progress" class="progress" hidden>
      <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
      <p id="summary" class="muted"></p>
    </div>

    <div id="empty" class="empty">
      <div class="empty-emoji">🌱</div>
      <h2>No habits yet</h2>
      <p class="muted">Tap the + button to add your first habit.</p>
    </div>

    <ul id="habit-list" class="habit-list"></ul>
  </main>

  <div id="dialog" class="dialog" hidden>
    <form id="habit-form" class="dialog-card" autocomplete="off">
      <div id="dialog-card" class="dialog-inner">
        <h2 id="dialog-title">New habit</h2>
        <label for="habit-name">Name</label>
        <input id="habit-name" type="text" maxlength="60" placeholder="e.g. Drink water" required>

        <label for="habit-emoji">Emoji</label>
        <div class="emoji-row">
          <input id="habit-emoji" type="text" maxlength="8" class="emoji-input" aria-label="Type your own emoji">
          <div id="emoji-picker" class="emoji-picker"></div>
        </div>

        <label>Colour</label>
        <div id="colour-picker" class="colour-picker"></div>

        <div class="dialog-actions">
          <button id="delete-btn" type="button" class="btn danger" hidden>Delete</button>
          <span class="spacer"></span>
          <button id="cancel-btn" type="button" class="btn">Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
